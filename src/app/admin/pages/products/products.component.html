<div class="products-page">

  <!-- HEADER -->
  <div class="page-header">
    <h1 class="page-title">Products</h1>

    <button class="add-btn" (click)="openAddModal()">
      ➕ Add Product
    </button>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table class="products-table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let product of products">
          <td class="image-cell">
            <img [src]="product.image" alt="Product" />
          </td>

          <td>
            <div [routerLink]="['/product', product.slug || product.id]" class="name">{{ product.name }}</div>
            <div class="desc">{{ product.description }}</div>
          </td>

          <td class="category">{{ product.category }}</td>

          <td class="price">
            ${{ product.price }}
            <span *ngIf="product.originalPrice" class="old-price">
              ${{ product.originalPrice }}
            </span>
          </td>

          <td>
            <span
              class="status"
              [class.in]="product.inStock"
              [class.out]="!product.inStock"
            >
              {{ product.inStock ? 'In Stock' : 'Out of Stock' }}
            </span>
          </td>

          <td class="actions">
            <button
              class="delete-btn"
              (click)="deleteProduct(product.id)"
            >
              🗑️
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ADD PRODUCT MODAL (UNCHANGED) -->
  <!-- ADD PRODUCT MODAL -->
  <div class="modal-backdrop" *ngIf="showAddModal">
    <div class="modal">
      <h2>Add Product</h2>

      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="newProduct.name" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="newProduct.description"></textarea>
      </div>

      <div class="form-group">
        <label>Price</label>
        <input type="number" [(ngModel)]="newProduct.price" />
      </div>

      <div class="form-group">
        <label>Original Price</label>
        <input type="number" [(ngModel)]="newProduct.originalPrice" />
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" [(ngModel)]="newProduct.category" />
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="text" [(ngModel)]="newProduct.image" />
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" [(ngModel)]="newProduct.inStock" />
        <label>In Stock</label>
      </div>

      <div class="modal-actions">
        <button class="save-btn" (click)="addProduct()">Save</button>
        <button class="cancel-btn" (click)="closeAddModal()">Cancel</button>
      </div>
    </div>
  </div>

</div>
