<div class="categories-page">

  <!-- HEADER -->
  <div class="page-header">
    <h1 class="page-title">Categories</h1>

    <button class="add-btn" (click)="openAddModal()">
      ➕ Add Category
    </button>
  </div>

  <!-- CATEGORY GRID -->
  <div class="categories-grid">
    <div class="category-wrapper" *ngFor="let cat of categories">
      <app-category-card [category]="cat"></app-category-card>

      <button class="delete-btn" (click)="deleteCategory(cat.id)">
        🗑️
      </button>
    </div>
  </div>

  <!-- ADD CATEGORY MODAL -->
  <div class="modal-backdrop" *ngIf="showAddModal">
    <div class="modal">
      <h2>Add Category</h2>

      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="newCategory.name" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="newCategory.description"></textarea>
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="text" [(ngModel)]="newCategory.image" />
      </div>

      <div class="modal-actions">
        <button class="save-btn" (click)="addCategory()">Save</button>
        <button class="cancel-btn" (click)="closeAddModal()">Cancel</button>
      </div>
    </div>
  </div>

</div>
