<div class="products-page">

  <!-- HERO -->
  <section class="products-hero">
    <div class="container hero-grid">

      <div class="hero-text">
        <span class="badge">Premium Device Store</span>
        <h1>Networking Devices Collection</h1>
        <p>
          Enterprise-grade routers, switches, and connectivity hardware
          engineered for reliability, performance, and scale.
        </p>
      </div>

      <div class="hero-stats">
        <div class="stat">
          <strong>{{ products.length }}+</strong>
          <span>Devices</span>
        </div>
        <div class="stat">
          <strong>24/7</strong>
          <span>Uptime</span>
        </div>
        <div class="stat">
          <strong>4.8★</strong>
          <span>Rating</span>
        </div>
      </div>

    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="products-body">
    <div class="container">

      <div class="top-bar">
        <h3>Available Devices</h3>
        <span>{{ products.length }} Products</span>
      </div>

      <div class="products-grid">
        <app-product-card
          *ngFor="let product of products"
          [product]="product">
        </app-product-card>
      </div>

    </div>
  </section>

</div>
