<nav class="navbar">
  <div class="navbar-container">

    <!-- BRAND -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="logo-icon">📡</span>
      <div class="logo-text">
        <span class="brand-name">NetLink</span>
        <span class="brand-tagline">Networking Devices Store</span>
      </div>
    </a>

    <!-- MOBILE TOGGLE -->
    <button
      class="mobile-toggle"
      (click)="toggleMenu()"
      [class.active]="isMenuOpen"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- MENU -->
    <div class="navbar-menu" [class.active]="isMenuOpen">
      <ul class="navbar-links">

        <li>
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            Home
          </a>
        </li>

        <li>
          <a
            routerLink="/products"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Devices
          </a>
        </li>

        <li>
          <a
            routerLink="/categories"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Categories
          </a>
        </li>

        <li>
          <a
            routerLink="/contact"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Contact
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>
